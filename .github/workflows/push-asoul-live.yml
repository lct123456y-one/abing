name: A-SOUL Live Push
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: 查B站直播状态并推送到网站
        run: |
          echo "=== 查询 5 位 A-SOUL 成员直播状态 ==="
          MEMBERS='[]'
          for entry in "嘉然:22637261" "乃琳:22625027" "贝拉:22632424" "心宜:30849777" "思诺:30858592"; do
            name="${entry%%:*}"
            rid="${entry##*:}"
            resp=$(curl -s --max-time 15 -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" -H "Referer: https://live.bilibili.com/" "https://api.live.bilibili.com/room/v1/Room/get_info?room_id=${rid}")
            live_status=$(echo "$resp" | jq -r '.data.live_status // 0' 2>/dev/null || echo 0)
            title=$(echo "$resp" | jq -r '.data.title // ""' 2>/dev/null || echo "")
            item=$(jq -nc --arg n "$name" --argjson r "$rid" --argjson l "$live_status" --arg t "$title" --arg u "https://live.bilibili.com/${rid}" '{name:$n,room:$r,live:($l==1),title:$t,url:$u}')
            MEMBERS=$(echo "$MEMBERS" | jq --argjson item "$item" '. + [$item]' 2>/dev/null || echo "[$item]")
          done
          echo "MEMBERS: $MEMBERS"
          echo "=== 推送 worker ==="
          curl -s --max-time 15 -X POST -H "Content-Type: application/json" -d "{\"members\":$MEMBERS}" "https://abing-chat.lct123456y.workers.dev/update-live"

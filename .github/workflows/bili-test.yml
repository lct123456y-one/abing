name: Bili Live Test
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 查 B站直播状态
        run: |
          echo "=== 测试 GitHub Action 能否查 B站 ==="
          for rid in 22625027 30849777; do
            echo "房间 ${rid}:"
            curl -s --max-time 15 -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" -H "Referer: https://live.bilibili.com/" "https://api.live.bilibili.com/room/v1/Room/get_info?room_id=${rid}" || echo "curl 失败"
            echo ""
          done

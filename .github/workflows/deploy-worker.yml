name: Deploy Worker
on:
  push:
    branches: [ master ]
    paths:
      - 'chat-worker.js'
      - 'wrangler.toml'
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install wrangler
        run: npm install -g wrangler@4.125.0
      - name: Put secrets and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          UPDATE_SECRET: ${{ secrets.UPDATE_SECRET }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          echo "$ADMIN_KEY" | wrangler secret put ADMIN_KEY
          echo "$UPDATE_SECRET" | wrangler secret put UPDATE_SECRET
          echo "$GH_DISPATCH_TOKEN" | wrangler secret put GITHUB_TOKEN
          wrangler deploy

<script>
  // A-SOUL 成员（头像 + 房间）
  const ASOUL = [
    { name: "嘉然", img: "./asoul-jiaran.jpg", room: 22637261 },
    { name: "乃琳", img: "./asoul-nailin.jpg", room: 22625027 },

    { name: "思诺", img: "./asoul-sinuo.jpg", room: 30858592 }

  // ---- A-SOUL 直播状态 + 安排 ----
  async function loadAsoul(){
    try {
      const res = await fetch('https://chat.abing.wtf/asoul-live');
      const data = await res.json();
      const wrap = document.getElementById('asoulLive');
      wrap.innerHTML = '';
      const uEl = document.getElementById('asoulUpdated');
      if (uEl && data.updated) { const mins = Math.max(0, Math.round((Date.now() - data.updated) / 60000)); uEl.textContent = '更新于 ' + mins + ' 分钟前' + (mins > 10 ? '（数据可能延迟）' : ''); }
      // 3+2 分组：前3一排，后2一排（心宜陪思诺）
      const mkRow = (arr, offset) => {
        const row = document.createElement('div'); row.className = 'asoul-live-row';
        arr.forEach((m, idx) => {
          const asoul = ASOUL[offset + idx] || ASOUL.find(x => x.name === m.name) || { name: m.name, img: '' };
          const card = document.createElement('a');
          card.className = 'asoul-live-card' + (m.live ? ' online' : '');
          card.href = m.url; card.target = '_blank';
          card.innerHTML = '<img src="' + asoul.img + '"><span class="nm">' + escapeHtml(asoul.name) + '</span><span class="dot"></span>' + (m.live ? '<span>开播中</span>' : '');
          row.appendChild(card);
        });
        return row;
      };
      if (data.members.length >= 5) {
        wrap.appendChild(mkRow(data.members.slice(0, 3), 0));
        wrap.appendChild(mkRow(data.members.slice(3), 3));
      } else {
        wrap.appendChild(mkRow(data.members, 0));
      }
    } catch(e) {}
  }
  // 本周安排（示例，主人每周更新）
    let SCHED = [];
  async function loadSched(){
    try {
      const r = await fetch('https://chat.abing.wtf/schedule');
      const d = await r.json();
      if (d.schedule && d.schedule.length) { SCHED = d.schedule; renderSched(); }
    } catch(e){}
  }
  function renderSched(){
    const box = document.getElementById('asoulSched');
    box.innerHTML = '';
    SCHED.forEach(d => {
      const dayDiv = document.createElement('div');
      dayDiv.className = 'day'; dayDiv.textContent = '· ' + d.day;
      box.appendChild(dayDiv);
      d.items.forEach(it => {
        const row = document.createElement('div');
        row.className = 'item';
        row.innerHTML = '<span class="m">' + escapeHtml(it.m) + '</span><span class="t">' + escapeHtml(it.t) + '</span>';
        box.appendChild(row);

  }
  renderSched(); loadSched();
  setInterval(loadSched, 180000); // 每 3 分钟刷新本周安排（Worker 每 30 分钟自动抓 asoulcalendar）
  // A-SOUL 抽屉懒加载：第一次拉开才请求直播状态 + 渲染头像（省首屏流量）
  let asoulLoaded = false;
  // "睡着了"成员（向晚/珈乐）
  const SLEEP = [
    { name: "向晚", img: "./asoul-xiangwan.jpg", uid: "672346917" },
    { name: "珈乐", img: "./asoul-jiale.jpg", uid: "351609538" }
  ];
  function renderSleep(){
    const box = document.getElementById('asoulSleep');
    if (!box || box.children.length) return;
    SLEEP.forEach(s => {
      const a = document.createElement('a');
      a.className = 'asoul-sleep-card';
      a.href = 'https://space.bilibili.com/' + s.uid; a.target = '_blank';
      a.innerHTML = '<img src="' + s.img + '"><span class="nm">' + s.name + ' 💤</span>';
      box.appendChild(a);
    });
  }
  setInterval(function(){ if (asoulLoaded) loadAsoul(); }, 180000);

  // 昵称记忆（localStorage，刷新/重进保持，可主动改）
  (function(){ try { const n = document.getElementById('chatName'); if (n) { n.value = localStorage.getItem('asoul_name') || '群友'; n.addEventListener('input', function(){ localStorage.setItem('asoul_name', n.value.trim()); }); } } catch(e){} })();
  // 名人堂/冥人堂
  var _hallUid = localStorage.getItem('hall_uid') || ('u' + Math.random().toString(36).slice(2,10));
  localStorage.setItem('hall_uid', _hallUid);
  // 头像映射：没有专属头像的用默认头像；"五更明月/折木"用折木头像
  const HALL_AVATARS = {
    "就看看p": "就看看p.jpg",
    "五级游侠": "五级游侠.jpg",
    "乃琳的皮鞭": "乃琳的皮鞭.jpg",
    "有爆有爆": "有爆有爆.jpg",
    "上流贝极星": "上流贝极星.jpg",
    "咸鱼星": "咸鱼星.jpg",
    "小三月": "小三月.jpg",
    "然宜": "然宜.jpg",
    "B猫": "B猫.jpg",
    "五更明月/折木": "折木.jpg"
  };
  const HALL_DEFAULT_AVATAR = "默认头像.jpg";
  function hallAvatar(name){
    const file = HALL_AVATARS[name] || HALL_DEFAULT_AVATAR;
    return './hall-avatars/' + encodeURIComponent(file);
  }
  function openHall(h){
    document.getElementById('hallTitle').textContent = h === 'ming' ? '💀 冥人堂' : '🏆 名人堂';
    document.getElementById('hallPanel').classList.add('show');
    fetch('https://chat.abing.wtf/hall-data').then(r=>r.json()).then(d => {
      const list = h === 'ming' ? d.ming : d.mingren;
      const box = document.getElementById('hallList'); box.innerHTML = '';
      list.forEach(it => {
        const div = document.createElement('div'); div.className = 'hall-item';
        const up = h === 'ming' ? '🙏' : '👍';
        const down = h === 'ming' ? '🤮' : '👎';
        const safe = it.name.replace(/'/g, '');
        div.innerHTML = '<div class="hall-avatar"><img src="' + hallAvatar(it.name) + '" alt="" onclick="alert(\'傻逼\')"></div><div class="hall-body"><div class="hall-nm"><span class="nm">' + it.name + '<span class="ct">赞' + it.up + ' / 负' + it.down + '</span></span><span class="vt"><button onclick="voteIt(this,\'' + h + '\',\'' + safe + '\',\'up\')">' + up + '</button><button onclick="voteIt(this,\'' + h + '\',\'' + safe + '\',\'down\')">' + down + '</button></span></div><div class="hall-desc">' + (it.desc || '') + '</div></div>';
        box.appendChild(div);
      });
    });
  }
  function closeHall(){ document.getElementById('hallPanel').classList.remove('show'); }
  function toggleHall(body){ const d = body.querySelector('.hall-desc'); if (d) d.style.display = (d.style.display === 'block' ? 'none' : 'block'); }
  function voteIt(btn, h, name, dir){
    fetch('https://chat.abing.wtf/vote', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ uid:_hallUid, hall:h, name:name, dir:dir }) })
      .then(r=>r.json()).then(d => {
        if (!d.ok) { alert(d.msg || '投票失败'); return; }
        // 反馈：按钮变"已投✓" + 禁用
        const txt = btn.textContent;
        const fb = txt.includes('🙏') ? '已上香 ✓' : txt.includes('🤮') ? '已吐痰 ✓' : txt.includes('👍') ? '已点赞 ✓' : '已点踩 ✓';
        btn.textContent = fb; btn.disabled = true;
        document.getElementById('hallRemain').textContent = '您今天还有 ' + d.remainingUp + ' 票正向 / ' + d.remainingDown + ' 票负向';
        // toast 反馈
        showToast(fb + '（' + name + '）');
        openHall(h);
      });
  }
  // 简易 toast 反馈（底部浮出）
  function showToast(msg){
    let t = document.getElementById('hallToast');
    if (!t) { t = document.createElement('div'); t.id = 'hallToast'; t.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(20,12,40,.92);color:#f0abfc;padding:10px 20px;border-radius:24px;font-size:14px;z-index:1000;transition:opacity .3s;border:1px solid rgba(240,171,252,.3);'; document.body.appendChild(t); }
    t.textContent = msg; t.style.opacity = '1';
    clearTimeout(t._tm); t._tm = setTimeout(() => { t.style.opacity = '0'; }, 1800);
  }
  function copyQQ(){
    navigator.clipboard.writeText("1098549767").then(()=>{      const b = document.querySelector(".copy");
      b.textContent = "已复制 ✓";
      setTimeout(()=>{ b.textContent = "复制群号"; }, 1500);
    });
  }
  let ws = null;
  let pollMode = false, lastMsgTime = 0, wsFail = 0, wsConnectingSince = 0;
  var _maintain = false;
  var _maintainLive = true; // 屏幕共享维护中（主人叫开再开，改成 false 恢复）
  function maintainBlock(nm){ if(_maintain){ alert(nm + " 功能维护中，请稍候~"); return true; } return false; }
  function toggleChat(){ if(maintainBlock("闲聊")) return; document.getElementById('chatPanel').classList.toggle('show'); }
  var _paused = false;
  function setPaused(p){ _paused = p; if(p){ try{ document.getElementById('wsTxt').textContent = '已暂停'; document.getElementById('wsDot').style.background = '#f59e0b'; }catch(e){} } }
  function pausedBlock(){ if(_paused){ alert('管理员已暂停互动，请稍候~'); return true; } return false; }
  // HTTP 轮询降级（wss 连不上时用）
  function startPolling(){
    if (pollMode) return;
    pollMode = true;
    setInterval(async () => {
      if (!pollMode) return; // WS 已恢复，停拉
      try {
        const r = await fetch('https://chat.abing.wtf/chat-his' + (lastMsgTime ? ('?since=' + lastMsgTime) : ''));
        const d = await r.json();
        (d.messages || []).forEach(m => { if (m.time > lastMsgTime) { lastMsgTime = m.time; addMsg(m); } });
      } catch(e){}
    }, 2500);
  }

  // ---- 通用拖动（标题栏，鼠标+触屏）----
  function makeDraggable(panel, head){
    let dragging = false, offX = 0, offY = 0;
    const start = function(x, y){ dragging = true; panel.classList.add('dragging'); offX = x - panel.offsetLeft; offY = y - panel.offsetTop; };
    const move = function(x, y){ if (!dragging) return; panel.style.left = (x - offX) + 'px'; panel.style.top = (y - offY) + 'px'; panel.style.right = 'auto'; panel.style.bottom = 'auto'; };
    const stop = function(){ dragging = false; panel.classList.remove('dragging'); };
    head.addEventListener('mousedown', function(e){ start(e.clientX, e.clientY); e.preventDefault(); });
    document.addEventListener('mousemove', function(e){ move(e.clientX, e.clientY); });
    document.addEventListener('mouseup', stop);
    head.addEventListener('touchstart', function(e){ const t = e.touches[0]; start(t.clientX, t.clientY); }, {passive:true});
    document.addEventListener('touchmove', function(e){ const t = e.touches[0]; move(t.clientX, t.clientY); }, {passive:true});
    document.addEventListener('touchend', stop);
  }
  // ---- 通用缩放（右下角把手，鼠标+触屏）----
  function makeResizable(panel, handle){
    let resizing = false, sx = 0, sy = 0, sw = 0, sh = 0;
    const start = function(x, y){ resizing = true; sx = x; sy = y; sw = panel.offsetWidth; sh = panel.offsetHeight; };
    const move = function(x, y){ if (!resizing) return; panel.style.width = Math.max(240, sw + (x - sx)) + 'px'; panel.style.height = Math.max(300, sh + (y - sy)) + 'px'; };
    const stop = function(){ resizing = false; };
    handle.addEventListener('mousedown', function(e){ start(e.clientX, e.clientY); e.preventDefault(); e.stopPropagation(); });
    document.addEventListener('mousemove', function(e){ move(e.clientX, e.clientY); });
    document.addEventListener('mouseup', stop);
    handle.addEventListener('touchstart', function(e){ const t = e.touches[0]; start(t.clientX, t.clientY); e.stopPropagation(); }, {passive:true});
    document.addEventListener('touchmove', function(e){ const t = e.touches[0]; move(t.clientX, t.clientY); }, {passive:true});
    document.addEventListener('touchend', stop);
  }
  makeDraggable(document.getElementById('chatPanel'), document.getElementById('chatHead'));
  makeResizable(document.getElementById('chatPanel'), document.getElementById('chatResize'));
  makeDraggable(document.getElementById('watchPanel'), document.getElementById('watchHead'));
  makeDraggable(document.getElementById('livePanel'), document.getElementById('liveHead'));
  // hallPanel 的 HTML 在本脚本之后才解析，等 DOM 就绪再初始化（否则 JS 崩溃、WS 连接全挂）
  document.addEventListener('DOMContentLoaded', function(){
    const hp = document.getElementById('hallPanel');
    const ht = document.getElementById('hallTitle');
    if (hp && ht) {
      makeDraggable(hp, ht.parentElement);
      makeResizable(hp, document.getElementById('hallResize'));
    }
  });
  makeResizable(document.getElementById('watchPanel'), document.getElementById('watchResize'));

  let wsConnectTimer = null;
  function connect(){
    // 已连接不重复建连；正在连接且未超过 8 秒也不重复（防止堆积连接）
    if (ws && ws.readyState === 1) return;
    if (ws && ws.readyState === 0 && Date.now() - wsConnectingSince < 8000) return;
    // 卡在 CONNECTING 超过 8 秒：强制关闭重连
    if (ws) { try { ws.close(); } catch(e){} ws = null; }
    wsConnectingSince = Date.now();
    try { ws = new WebSocket('wss://chat.abing.wtf'); } catch(e){ ws = null; setTimeout(connect, 3000); return; }
    // 8 秒还没连上就强制重建（双保险，不依赖外部保活定时器）
    clearTimeout(wsConnectTimer);
    wsConnectTimer = setTimeout(function(){
      if (ws && ws.readyState === 0) { try { ws.close(); } catch(e){} ws = null; connect(); }
    }, 8000);
    ws.onmessage = (ev) => {
      const d = JSON.parse(ev.data);
      if (d.type === 'history') { d.messages.forEach(addMsg); }
      else if (d.type === 'chat') {
        // 自己刚发的消息本地已显示，广播回来按 id 去重，不重复添加
        if (d.message && d.message.id && document.querySelector('.msg[data-mid="' + d.message.id + '"]')) return;
        addMsg(d.message);
      }
      else if (d.type === 'danmu' && d.message && d.message.text) { showDanmu(d.message); }
      else if (d.type === 'blocked') { alert('你TM别给我乱讲话！'); }
      else if (d.type === 'watch' && d.watch && d.watch.url) {
        document.getElementById('watchUrl').value = d.watch.url;
        // 懒加载：只在面板打开时设置 iframe src（避免 B站播放器后台刷请求挤 ws）
        if (document.getElementById('watchPanel').classList.contains('show')) {
          document.getElementById('watchFrame').src = d.watch.url;
        }
      }
    };
    ws.onopen = () => { clearTimeout(wsConnectTimer); wsFail = 0; wsConnectingSince = 0; pollMode = false; try { document.getElementById('wsDot').style.background = '#22c55e'; document.getElementById('wsTxt').textContent = '已连接'; } catch(e){} };
    ws.onerror = () => { /* 交给 onclose 统一处理重连 */ };
    ws.onclose = () => {
      clearTimeout(wsConnectTimer);
      if (ws) { ws = null; }
      try { document.getElementById('wsDot').style.background = '#f87171'; document.getElementById('wsTxt').textContent = '未连接，自动重连中…'; } catch(e){}
      wsFail++;
      if (wsFail > 2) startPolling(); // 连续失败降级 HTTP 轮询，但 WS 仍会继续重试
      setTimeout(connect, 3000);
    };
  }
  function addMsg(m){
    if (!m || (!m.text && !m.image)) return;
    const box = document.getElementById('chatMsgs');
    const div = document.createElement('div');
    div.className = 'msg';
    if (m.id) div.dataset.mid = m.id;
    const d = new Date(m.time);
    const today = new Date();
    const when = (d.toDateString() === today.toDateString() ? '' : (d.getMonth() + 1) + '/' + d.getDate() + ' ') + d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    let content = '';
    if (m.image) {
      content = '<img src="' + m.image + '" style="max-width:100%;max-height:200px;border-radius:8px;display:block;margin-top:4px;" onclick="window.open(this.src)">';
    }
    if (m.text) {
      content = '<div>' + emojiToHtml(m.text) + '</div>' + content;
    }
    const head = document.createElement('div');
    head.className = 'msg-head';
    head.innerHTML = '<span class="who"></span><span class="when">' + when + '</span>';
    head.querySelector('.who').textContent = m.name + ':';
    div.appendChild(head);
    const body = document.createElement('div');
    body.className = 'msg-body';
    body.innerHTML = content;
    div.appendChild(body);
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
    if (box.children.length > 100) box.removeChild(box.firstChild);
  }
  function sendMsg(){ if(pausedBlock()) return;
    const t = document.getElementById('chatText').value.trim();
    const n = document.getElementById('chatName').value.trim() || '匿名';
    if (!t) return;
    if (pollMode) {
      // 轮询模式：HTTP 发送
      fetch('https://chat.abing.wtf/chat-send', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type:'chat', name:n, text:t })
      }).then((r) => { if (r && r.ok === false && r.blocked) { alert('你TM别给我乱讲话！'); } else { addMsg({ name:n, text:t, time: Date.now() }); } }).catch(()=>{});
      document.getElementById('chatText').value = '';
      return;
    }
    if (!ws || ws.readyState !== 1) {
      document.getElementById('chatText').value = t;
      document.getElementById('chatText').placeholder = '连接中，稍等或直接发送~';
      connect(); // 全局保活会持续重连，不用手动发消息触发
      return;
    }
    const mid = crypto.randomUUID();
    ws.send(JSON.stringify({ type:'chat', name:n, text:t, id:mid }));
    addMsg({ id:mid, name:n, text:t, time: Date.now() }); // 本地立即显示，广播回来按 id 去重
    document.getElementById('chatText').value = '';
  }
  // 弹幕
  function sendDanmu(){ if(pausedBlock()) return;
    const t = document.getElementById('danmuText').value.trim();
    const n = document.getElementById('chatName').value.trim() || '匿名';
    if (!t || !ws || ws.readyState !== 1) return;
    ws.send(JSON.stringify({ type:'danmu', name:n, text:t }));
    document.getElementById('danmuText').value = '';
  }
  function showDanmu(m){
    const layer = document.getElementById('danmuLayer');
    while (layer.children.length > 30) layer.removeChild(layer.firstChild); // 同屏最多 30 条，防刷屏卡顿
    const el = document.createElement('div');
    el.className = 'danmu-item';
    el.innerHTML = emojiToHtml(m.name + ': ' + m.text);
    const top = 10 + Math.random() * 70;
    el.style.top = top + 'vh';
    const dur = 5 + Math.random() * 4;
    el.style.animationDuration = dur + 's';
    layer.appendChild(el);
    setTimeout(() => { el.remove(); }, dur * 1000 + 500);
  }
  document.getElementById('danmuText').addEventListener('keydown', e => { if (e.key === 'Enter') sendDanmu(); });
  // ---- 粘贴图片发送（自动压缩到 ≤1024px）----
  document.getElementById('chatText').addEventListener('paste', (e) => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (let i = 0; i < items.length; i++) {
      if (items[i].type && items[i].type.indexOf('image') === 0) {
        const file = items[i].getAsFile();
        if (file) { e.preventDefault(); sendImage(file); break; }
      }
    }
  });
  function sendImage(file){
    const n = document.getElementById('chatName').value.trim() || '匿名';
    const img = new Image();
    const reader = new FileReader();
    reader.onload = () => {
      img.onload = () => {
        let w = img.width, h = img.height;
        const max = 1024;
        if (w > max || h > max) {
          const r = Math.min(max/w, max/h);
          w = Math.round(w*r); h = Math.round(h*r);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const base64 = canvas.toDataURL('image/jpeg', 0.8);
        if (!ws || ws.readyState !== 1) return;
        const mid = crypto.randomUUID();
        ws.send(JSON.stringify({ type:'chat', name:n, text:'', image:base64, id:mid }));
        addMsg({ id:mid, name:n, text:'', image:base64, time: Date.now() }); // 本地立即显示
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }
  function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  // emoji 图片化：把 emoji 字符替换成 noto-emoji 的 SVG 图片（系统字体不支持的新 emoji 也能显示）
  function emojiToHtml(text){
    const safe = escapeHtml(String(text || ''));
    if (!window.emojiRegex) return safe; // emoji-regex 还没加载好，先纯文本
    try {
      return safe.replace(window.emojiRegex(), (m) => {
        let cps = [];
        for (const ch of m) cps.push(ch.codePointAt(0).toString(16));
        const code = cps.join('_');
        return '<img class="emoji" draggable="false" alt="' + m + '" src="https://cdn.jsdelivr.net/gh/googlefonts/noto-emoji@main/svg/emoji_u' + code + '.svg">';
      });
    } catch(e) { return safe; }
  }
  document.getElementById('chatText').addEventListener('keydown', e => { if (e.key === 'Enter') sendMsg(); });
  connect();
  // WS 保活：每 5 秒检查，未连接/卡连接中超过 8 秒就自动重连（不用发消息触发）
  setInterval(connect, 5000);

  // ---- 一起看 ----
  function toggleWatch(){ if(maintainBlock("一起看")) return; const p = document.getElementById('watchPanel'); p.classList.toggle('show'); if (p.classList.contains('show')) { const u = document.getElementById('watchUrl').value; if (u) document.getElementById('watchFrame').src = u; } }
  function biliToEmbed(url){
    let u = url.trim();
    // 纯 BV 号：BVxxxxxxxxxx
    if (/^BV[0-9A-Za-z]{10,}/.test(u)) return 'https://player.bilibili.com/player.html?bvid=' + u.match(/^BV[0-9A-Za-z]+/)[0] + '&autoplay=0';
    // 完整 URL
    const m = u.match(/bilibili\.com\/video\/(BV[0-9A-Za-z]+)/);
    if (m) return 'https://player.bilibili.com/player.html?bvid=' + m[1] + '&autoplay=0';
    return u;
  }
  function sendWatch(){ if(pausedBlock()) return;
    const raw = document.getElementById('watchUrl').value.trim();
    if (!raw || !ws || ws.readyState !== 1) return;
    const url = biliToEmbed(raw);
    if (!/^https?:\/\//i.test(url)) { alert('只支持 http/https 链接哦'); return; }
    const name = document.getElementById('chatName').value.trim() || '匿名';
    ws.send(JSON.stringify({ type:'watch', url:url, name:name }));
    document.getElementById('watchFrame').src = url;
  }
  document.getElementById('watchUrl').addEventListener('keydown', e => { if (e.key === 'Enter') sendWatch(); });

  // ---- LiveKit 屏幕共享（livekit-client 库懒加载：打开面板才加载，省首屏 567KB）----
  let lkRoom = null;
  let livekitLoading = null;
  function loadLiveKit(){
    if (window.LivekitClient) return Promise.resolve();
    if (livekitLoading) return livekitLoading;
    livekitLoading = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = './livekit-client.umd.min.js';
      s.onload = () => resolve();
      s.onerror = () => { livekitLoading = null; reject(new Error('livekit 加载失败')); };
      document.body.appendChild(s);
    });
    return livekitLoading;
  }
  async function getLkRoom(){
    await loadLiveKit();
    if (!lkRoom) lkRoom = new LivekitClient.Room();
    return lkRoom;
  }
  let lkJoined = false;
  let liveEventsBound = false;
  async function bindLiveEvents(){
    if (liveEventsBound) return;
    liveEventsBound = true;
    const room = await getLkRoom();
    // 事件监听放在 connect 前，确保不漏早期订阅
    room.on('trackSubscribed', (track, pub, participant) => {
      if (participant.identity === room.localParticipant.identity) return;
      // 视频 + 音频都 attach 到 liveRemote（video 元素同时输出画面和声音）
      if (track.kind === 'video' || track.kind === 'audio') {
        track.attach(document.getElementById('liveRemote'));
        document.getElementById('liveRemote').muted = false;
        document.getElementById('liveRemote').volume = 0.1; // 默认音量 10%（不吵）
        document.getElementById('livePanel').classList.add('show');
        setLiveStatus('正在观看共享屏幕');
        const v = document.getElementById('liveRemote'); v.play().catch(function(){});
      }
    });
    room.on('trackUnsubscribed', (track) => { track.detach(); });
  }
  async function connectLive(token, url){
    await bindLiveEvents();
    const room = await getLkRoom();
    await room.connect(url, token);
    lkJoined = true;
  }
  function toggleLive(){
    const p = document.getElementById('livePanel');
    // 已打开时点按钮 = 正常关闭（断连释放额度）
    if (p.classList.contains('show')) {
      p.classList.remove('show');
      if (lkJoined) { try { if (lkRoom) lkRoom.disconnect(); } catch(e){} lkJoined = false; }
      return;
    }
    // 维护中：点开就弹窗
    if (_maintainLive) { alert("屏幕共享 功能维护中，请稍候~"); return; }
    p.classList.add('show');
    try { lkJoin(); } catch(e){}
  }
  function toggleAsoul(){ document.querySelector('.asoul-side').classList.toggle('open'); if (!asoulLoaded) { asoulLoaded = true; loadAsoul(); renderSleep(); } }
  function fs(id){
    const el = document.getElementById(id);
    if (el.requestFullscreen) { el.requestFullscreen().then(()=>{ try { screen.orientation.lock('landscape'); } catch(e){} }); }
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }
  function exitFs(){ if (document.exitFullscreen) document.exitFullscreen(); }
  function setVol(v){ document.getElementById('liveRemote').volume = parseFloat(v); }
  function back10(){ const v = document.getElementById('liveRemote'); v.currentTime = Math.max(0, v.currentTime - 10); }
  function fwd10(){ const v = document.getElementById('liveRemote'); v.currentTime = v.currentTime + 10; }
  function setLiveStatus(s){ document.getElementById('liveStatus').textContent = s; }
  async function lkGetToken(identity, wantPublish, pass){
    const p = new URLSearchParams({ identity: identity, room: 'abing', uid: _hallUid });
    if (wantPublish) p.set('publish', '1');
    if (pass) p.set('pass', pass);
    const res = await fetch('https://chat.abing.wtf/token?' + p.toString());
    if (res.status === 403) { try { return await res.json(); } catch(e) { return { error: 'forbidden' }; } }
    return await res.json();
  }
  async function lkJoin(){
    if (lkJoined) return true;
    // 查密码状态+版本号：只在打开「屏幕共享」面板时要求密码（不看不弹）
    const panelOpen = document.getElementById('livePanel').classList.contains('show');
    try {
      const pr = await fetch('https://chat.abing.wtf/get-live-pass');
      const pd = await pr.json();
      if (panelOpen && pd.hasPass && (!window._authed || window._authedRev !== pd.rev)) {
        const input = prompt('本次屏幕共享需要密码，请输入：');
        if (!input) { setLiveStatus('未输入密码'); return false; }
        const id0 = 'u' + Math.random().toString(36).slice(2,8);
        const t0 = await lkGetToken(id0, false, input);
        if (t0.error) { setLiveStatus('密码错误，无法观看'); return false; }
        window._authed = true; window._authedRev = pd.rev; window._lastPass = input;
      }
    } catch(e) {}
    const id = 'u' + Math.random().toString(36).slice(2,8);
    const tk = await lkGetToken(id, false, window._lastPass || '');
    if (tk.error) { setLiveStatus(tk.error === 'wrong-pass' ? '密码错误，无法观看' : '无法获取观看权限'); return false; }
    await connectLive(tk.token, tk.url);
    return true;
  }
  async function startShare(){ if(_maintainLive){ alert("屏幕共享 功能维护中，请稍候~"); return; } if(pausedBlock()) return;
    try {
      // 设置密码（可选）：填了则设，没填则清空（带 uid，只有当前共享者能设）
      const pass = document.getElementById('livePass').value.trim();
      const r = await fetch('https://chat.abing.wtf/set-live-pass?pass=' + encodeURIComponent(pass) + '&uid=' + _hallUid);
      const rj = await r.json().catch(()=>({}));
      if (!rj.ok) { setLiveStatus(rj.msg || '设置密码失败'); return; }
      if (lkJoined) { try { if (lkRoom) lkRoom.disconnect(); } catch(e){} lkJoined = false; }
      // 共享者用 publish token 连接（有密码时只有密码主人 uid 能拿发布权）
      const id = 'u' + Math.random().toString(36).slice(2,8);
      const tk = await lkGetToken(id, true, pass);
      if (tk.error) { setLiveStatus('无法获取共享权限（密码可能被他人设置）'); return; }
      await connectLive(tk.token, tk.url);
      const room = await getLkRoom();
      // 画质策略：默认流畅优先（720p/15帧/VP8/1.2Mbps），可选清晰（1080p/25帧/VP8/3.5Mbps）
      // 免费版 LiveKit 对 VP8 支持最好，高帧率+高码率容易被限速导致卡顿
      const quality = document.getElementById('liveQuality')?.value || 'smooth';
      const isHD = quality === 'hd';
      const q = isHD
        ? { video: { frameRate: { ideal: 24, max: 24 }, width: { ideal: 1920 }, height: { ideal: 1080 } }, maxBitrate: 3500000, maxFramerate: 24, videoCodec: 'vp8', label: '1080p/24fps' }
        : { video: { frameRate: { ideal: 24, max: 24 }, width: { ideal: 1280 }, height: { ideal: 720 } }, maxBitrate: 1200000, maxFramerate: 24, videoCodec: 'vp8', label: '720p/24fps' };
      const screen = await navigator.mediaDevices.getDisplayMedia({ video: q.video, audio: true });
      await room.localParticipant.publishTrack(screen.getVideoTracks()[0], {
        source: 'screen_share',
        name: 'screen',
        videoCodec: q.videoCodec,
        videoEncoding: { maxBitrate: q.maxBitrate, maxFramerate: q.maxFramerate },
      });
      // 发布音频（屏幕共享的声音/系统声/麦克风），限制 64kbps 防抢带宽
      if (screen.getAudioTracks().length > 0) {
        await room.localParticipant.publishTrack(screen.getAudioTracks()[0], { source: 'microphone', name: 'screen-audio', audioBitrate: 64000 });
      }
      document.getElementById('liveLocal').srcObject = screen;
      document.getElementById('livePreview').style.display = 'block';
      setLiveStatus((pass ? ('共享中 ✓ 已设密码：' + pass) : '共享中 ✓（无密码，谁都能看）') + ' · ' + q.label);
    } catch(e){
      setLiveStatus('共享失败：' + e.message);
    }
  }
  // 观众不再自动 join（省 LiveKit 额度）——打开「屏幕共享」面板时才连接
  // （在 toggleLive 里 lkJoin；这里不再全站自动 join 占 participant 分钟）
  // 心跳密码检测：只在打开「屏幕共享」面板时验证（不看不弹）
  window._authed = false; window._authedRev = 0; window._lastPass = '';
  setInterval(async () => {
    try {
      if (lkJoined && document.getElementById('livePanel').classList.contains('show')) {
        const pd = await (await fetch('https://chat.abing.wtf/get-live-pass')).json();
        if (pd.hasPass && (!window._authed || window._authedRev !== pd.rev)) {
          const input = prompt('屏幕共享密码已更新，请输入：');
          if (input) {
            const id0 = 'u' + Math.random().toString(36).slice(2,8);
            const t0 = await lkGetToken(id0, false, input);
            if (!t0.error) { window._authed = true; window._authedRev = pd.rev; window._lastPass = input; return; }
          }
          if (lkRoom) lkRoom.disconnect(); lkJoined = false; window._authed = false; window._authedRev = 0; window._lastPass = '';
        }
      }
    } catch(e){}
  }, 30000);
  // 用户点击画面 → 解锁声音（浏览器 autoplay 限制）
  document.addEventListener('click', function tryUnlock(){
    const v = document.getElementById('liveRemote');
    if (v && v.readyState > 0) {
      v.muted = false;
      v.play().then(() => { document.removeEventListener('click', tryUnlock); }).catch(function(){});
    }
  });
</script>

    <button class="ming" onclick="openHall('ming')">💀 冥人堂</button>

  </div>

    <h3><span id="hallTitle">🏆 名人堂</span><button class="hclose" onclick="closeHall()">×</button></h3>
    <div id="hallList"></div>
    <div class="hall-remain" id="hallRemain"></div>

    <div id="hallResize"></div>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>a冰4.0 · QQ群发布页</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(ellipse at 20% 10%, rgba(124,58,237,.35), transparent 50%),
                radial-gradient(ellipse at 80% 30%, rgba(236,72,153,.25), transparent 50%),
                radial-gradient(ellipse at 50% 90%, rgba(59,130,246,.3), transparent 55%),
                linear-gradient(160deg, #0f0c29 0%, #1a1a4b 40%, #2d1b69 100%);
    color: #fff; padding: 20px; background-attachment: fixed;
  }
  .card {
    background: linear-gradient(rgba(20,12,40,.85), rgba(20,12,40,.85)), url('./ranran-bg.jpg') center/cover no-repeat;
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 24px; padding: 48px 56px; max-width: 460px; width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(76,29,149,.4), 0 0 0 1px rgba(255,255,255,.04) inset;
    position: relative; overflow: hidden;
  }
  .ranran-avatar { width: 96px; height: 96px; border-radius: 50%; border: 3px solid rgba(244,114,182,.6); box-shadow: 0 0 20px rgba(168,85,247,.5); margin: -20px auto 14px; display: block; object-fit: cover; }
  .card::before { content: "✨"; position: absolute; top: 16px; left: 16px; font-size: 20px; opacity: .7; animation: twinkle 2.5s ease-in-out infinite; }
  .card::after { content: "⭐"; position: absolute; top: 16px; right: 16px; font-size: 20px; opacity: .7; animation: twinkle 2.5s ease-in-out infinite .6s; }
  @keyframes twinkle { 0%,100%{ opacity:.4; transform:scale(.9);} 50%{ opacity:1; transform:scale(1.1);} }
  .badge {
    display: inline-block; background: linear-gradient(90deg, rgba(168,85,247,.3), rgba(236,72,153,.3));
    color: #e9d5ff; border: 1px solid rgba(168,85,247,.5); padding: 6px 18px; border-radius: 100px;
    font-size: 13px; letter-spacing: 2px; margin-bottom: 20px;
  }
  h1 { font-size: 42px; font-weight: 800; letter-spacing: 4px;
    background: linear-gradient(90deg, #e9d5ff, #f0abfc 40%, #fbbf24 90%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
  .sub { color: rgba(255,255,255,0.6); font-size: 14px; margin-bottom: 32px; letter-spacing: 1px; }
  .qq { font-size: 36px; font-weight: 700; letter-spacing: 3px; margin-bottom: 8px; font-variant-numeric: tabular-nums; }
  .qq-label { color: rgba(255,255,255,0.5); font-size: 13px; margin-bottom: 28px; }
  .btn {
    display: inline-block; width: 100%; padding: 16px 0; border-radius: 14px; border: none;
    font-size: 18px; font-weight: 700; letter-spacing: 3px; cursor: pointer;
    background: linear-gradient(90deg, #a855f7, #ec4899); color: #fff;
    transition: all .25s; text-decoration: none;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(168,85,247,.5); }
  .copy { margin-top: 14px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: rgba(255,255,255,0.85); }
  .copy:hover { background: rgba(255,255,255,0.15); box-shadow: none; transform: none; }
  .tip { margin-top: 24px; color: rgba(255,255,255,0.35); font-size: 12px; }

  /* 聊天空窗 */
  #chatPanel { display:none; position:fixed; bottom:20px; right:20px; width:340px; height:480px;
    background:#231437; border-radius:16px; box-shadow:0 12px 40px rgba(0,0,0,.5);
    flex-direction:column; overflow:hidden; z-index:99; border:1px solid rgba(255,255,255,.1); }
  #chatPanel.show { display:flex; }
  #chatPanel.dragging { opacity:.85; user-select:none; }
  #chatHead { background:linear-gradient(90deg,#a855f7,#ec4899); color:#fff; padding:10px 16px; font-size:15px; font-weight:700; display:flex; justify-content:space-between; align-items:center; cursor:move; }
  #chatClose { background:none; border:none; color:#fff; font-size:18px; cursor:pointer; }
  #chatMsgs { flex:1; overflow-y:auto; padding:12px; background:#1a0f2e; }
  .msg { margin-bottom:8px; font-size:14px; color:#e6edf5; }
  .msg .who { font-weight:700; color:#c4b5fd; margin-right:6px; }
  .msg .when { color:#8b7aa8; font-size:11px; margin-left:6px; }
  #chatInput { display:flex; border-top:1px solid rgba(255,255,255,.1); padding:8px; background:#1e2a38; }
  #chatName { width:30%; border:1px solid rgba(255,255,255,.2); background:#1a0f2e; color:#e6edf5; border-radius:8px; padding:8px; margin-right:6px; font-size:13px; }
  #chatText { flex:1; border:1px solid rgba(255,255,255,.2); background:#1a0f2e; color:#e6edf5; border-radius:8px; padding:8px; font-size:13px; }
  #chatSend { background:#a855f7; color:#fff; border:none; border-radius:8px; padding:0 14px; margin-left:6px; cursor:pointer; font-size:13px; }
  #chatResize { position:absolute; bottom:0; right:0; width:16px; height:16px; cursor:nwse-resize; background:linear-gradient(135deg,transparent 50%,rgba(255,255,255,.4) 50%); }
  /* 聊天入口：左中上，更显眼 */
  #chatFab { position:fixed; top:120px; left:20px; padding:12px 20px; border-radius:24px;
    background:linear-gradient(90deg,#a855f7,#ec4899); color:#fff; font-size:16px; font-weight:700;
    border:none; cursor:pointer; box-shadow:0 6px 20px rgba(168,85,247,.5); z-index:98; }
  #chatFab:hover { transform:scale(1.05); }

  /* 一起看面板 */
  #watchFab { position:fixed; top:190px; left:20px; padding:12px 20px; border-radius:24px;
    background:linear-gradient(90deg,#c084fc,#f472b6); color:#fff; font-size:16px; font-weight:700;
    border:none; cursor:pointer; box-shadow:0 6px 20px rgba(244,114,182,.5); z-index:98; }
  #watchFab:hover { transform:scale(1.05); }
  #watchPanel { display:none; position:fixed; bottom:20px; left:20px; width:520px; height:420px;
    background:#231437; border-radius:16px; box-shadow:0 12px 40px rgba(0,0,0,.5);
    flex-direction:column; overflow:hidden; z-index:99; border:1px solid rgba(255,255,255,.1); }
  #watchPanel.show { display:flex; }
  #watchHead { background:linear-gradient(90deg,#c084fc,#f472b6); color:#fff; padding:10px 16px; font-size:15px; font-weight:700; display:flex; justify-content:space-between; align-items:center; cursor:move; }
  #watchClose { background:none; border:none; color:#fff; font-size:18px; cursor:pointer; }
  #watchInput { display:flex; padding:8px; background:#1e2a38; border-bottom:1px solid rgba(255,255,255,.1); }
  #watchUrl { flex:1; border:1px solid rgba(255,255,255,.2); background:#1a0f2e; color:#e6edf5; border-radius:8px; padding:8px; font-size:13px; }
  #watchGo { background:#ff6b6b; color:#fff; border:none; border-radius:8px; padding:0 16px; margin-left:6px; cursor:pointer; font-size:13px; }
  #watchFrame { flex:1; border:none; background:#000; }
  #watchHint { color:#8b7aa8; font-size:12px; padding:6px 12px; }
  #watchResize { position:absolute; bottom:0; right:0; width:16px; height:16px; cursor:nwse-resize; background:linear-gradient(135deg,transparent 50%,rgba(255,255,255,.4) 50%); }

  /* LiveKit 面板 */
  #liveFab { position:fixed; top:260px; left:20px; padding:12px 20px; border-radius:24px;
    background:linear-gradient(90deg,#a855f7,#a78bfa); color:#fff; font-size:16px; font-weight:700;
    border:none; cursor:pointer; box-shadow:0 6px 20px rgba(168,85,247,.5); z-index:98; }
  #liveFab:hover { transform:scale(1.05); }
  #livePanel { display:none; position:fixed; bottom:20px; left:20px; width:560px; height:440px;
    background:#231437; border-radius:16px; box-shadow:0 12px 40px rgba(0,0,0,.5);
    flex-direction:column; overflow:hidden; z-index:99; border:1px solid rgba(255,255,255,.1); }
  #livePanel.show { display:flex; }
  #liveHead { background:linear-gradient(90deg,#a855f7,#a78bfa); color:#fff; padding:10px 16px; font-size:15px; font-weight:700; display:flex; justify-content:space-between; align-items:center; cursor:move; }
  #liveClose { background:none; border:none; color:#fff; font-size:18px; cursor:pointer; }
  #liveBtns { display:flex; align-items:center; gap:10px; padding:10px 12px; }
  #shareBtn { background:#a855f7; color:#fff; border:none; border-radius:8px; padding:10px 18px; cursor:pointer; font-size:14px; font-weight:700; }
  #liveStatus { color:#8b7aa8; font-size:13px; }
  #livePreview { display:none; padding:0 12px; }
  #liveLocal { width:100%; max-height:180px; border-radius:8px; background:#000; margin-bottom:8px; }
  #liveWatch { flex:1; padding:0 12px; }
  #liveRemote { width:100%; height:100%; border-radius:8px; }
  #liveHint { color:#8b7aa8; font-size:12px; padding:6px 12px; }
</style>
</head>
<body>
  <div class="card">
    <img class="ranran-avatar" src="./ranran-avatar.jpg" alt="a冰4.0">
    <div class="badge">NEW · 新群</div>
    <h1>a冰4.0</h1>
    <div class="sub">A B I N G · 4 . 0</div>
    <div class="qq">1098549767</div>
    <div class="qq-label">QQ 群号</div>
    <a class="btn" href="https://qm.qq.com/q/NHqdexMLOo" target="_blank" rel="noopener">一键加群</a>
    <button class="btn copy" onclick="copyQQ()">复制群号</button>
    <div class="tip">Abing.www · 欢迎回家</div>
  </div>

  <button id="chatFab" onclick="toggleChat()">💬 闲聊</button>
  <button id="watchFab" onclick="toggleWatch()">🎬 一起看</button>
  <button id="liveFab" onclick="toggleLive()">📺 屏幕共享</button>
  <div id="livePanel">
    <div id="liveHead"><span>📺 LiveKit 屏幕共享</span><button id="liveClose" onclick="toggleLive()">×</button></div>
    <div id="liveBtns">
      <button id="shareBtn" onclick="startShare()">🖥️ 我共享屏幕</button>
      <span id="liveStatus">未连接</span>
    </div>
    <div id="livePreview"><video id="liveLocal" autoplay muted playsinline></video></div>
    <div id="liveWatch"><video id="liveRemote" autoplay playsinline style="background:#000"></video></div>
    <div id="liveHint">共享者：点「我共享屏幕」选要共享的窗口；其他人自动看到，声音也会带上</div>
  </div>
  <div id="watchPanel">
    <div id="watchHead"><span>🎬 一起看</span><button id="watchClose" onclick="toggleWatch()">×</button></div>
    <div id="watchInput">
      <input id="watchUrl" placeholder="贴 B站视频/直播链接 或 网页地址…" maxlength="500">
      <button id="watchGo" onclick="sendWatch()">播放</button>
    </div>
    <div id="watchHint">提示：B站视频/直播、mp4、可嵌入的网页都能一起看；防嵌入的网站会白屏</div>
    <iframe id="watchFrame" allow="autoplay; fullscreen; encrypted-media" allowfullscreen></iframe>
    <div id="watchResize"></div>
  </div>

  <div id="chatPanel">
    <div id="chatHead"><span>💬 a冰闲聊区</span><button id="chatClose" onclick="toggleChat()">×</button></div>
    <div id="chatMsgs"></div>
    <div id="chatInput">
      <input id="chatName" placeholder="昵称" maxlength="20" value="群友">
      <input id="chatText" placeholder="说点什么…" maxlength="500">
      <button id="chatSend" onclick="sendMsg()">发送</button>
    </div>
    <div id="chatResize"></div>
  </div>
<script src="./livekit-client.umd.min.js"></script>
<script>
  function copyQQ(){
    navigator.clipboard.writeText("1098549767").then(()=>{
      const b = document.querySelector(".copy");
      b.textContent = "已复制 ✓";
      setTimeout(()=>{ b.textContent = "复制群号"; }, 1500);
    });
  }
  let ws = null;
  function toggleChat(){ document.getElementById('chatPanel').classList.toggle('show'); }

  // ---- 通用拖动（标题栏）----
  function makeDraggable(panel, head){
    let dragging = false, offX = 0, offY = 0;
    head.addEventListener('mousedown', function(e){
      dragging = true; panel.classList.add('dragging');
      offX = e.clientX - panel.offsetLeft; offY = e.clientY - panel.offsetTop;
      e.preventDefault();
    });
    document.addEventListener('mousemove', function(e){
      if (!dragging) return;
      panel.style.left = (e.clientX - offX) + 'px';
      panel.style.top = (e.clientY - offY) + 'px';
      panel.style.right = 'auto'; panel.style.bottom = 'auto';
    });
    document.addEventListener('mouseup', function(){ dragging = false; panel.classList.remove('dragging'); });
  }
  // ---- 通用缩放（右下角把手）----
  function makeResizable(panel, handle){
    let resizing = false, sx = 0, sy = 0, sw = 0, sh = 0;
    handle.addEventListener('mousedown', function(e){
      resizing = true; sx = e.clientX; sy = e.clientY;
      sw = panel.offsetWidth; sh = panel.offsetHeight; e.preventDefault(); e.stopPropagation();
    });
    document.addEventListener('mousemove', function(e){
      if (!resizing) return;
      panel.style.width = Math.max(240, sw + (e.clientX - sx)) + 'px';
      panel.style.height = Math.max(300, sh + (e.clientY - sy)) + 'px';
    });
    document.addEventListener('mouseup', function(){ resizing = false; });
  }
  makeDraggable(document.getElementById('chatPanel'), document.getElementById('chatHead'));
  makeResizable(document.getElementById('chatPanel'), document.getElementById('chatResize'));
  makeDraggable(document.getElementById('watchPanel'), document.getElementById('watchHead'));
  makeResizable(document.getElementById('watchPanel'), document.getElementById('watchResize'));

  function connect(){
    try { ws = new WebSocket('wss://abing-chat.lct123456y.workers.dev'); } catch(e){ return; }
    ws.onmessage = (ev) => {
      const d = JSON.parse(ev.data);
      if (d.type === 'history') { d.messages.forEach(addMsg); }
      else if (d.type === 'chat') { addMsg(d.message); }
      else if (d.type === 'watch' && d.watch && d.watch.url) {
        document.getElementById('watchFrame').src = d.watch.url;
        document.getElementById('watchUrl').value = d.watch.url;
        document.getElementById('watchPanel').classList.add('show');
      }
    };
    ws.onclose = () => { setTimeout(connect, 3000); };
  }
  function addMsg(m){
    if (!m || (!m.text && !m.image)) return;
    const box = document.getElementById('chatMsgs');
    const div = document.createElement('div');
    div.className = 'msg';
    const when = new Date(m.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    let content = '';
    if (m.image) {
      content = '<img src="' + m.image + '" style="max-width:100%;max-height:200px;border-radius:8px;display:block;margin-top:4px;" onclick="window.open(this.src)">';
    }
    if (m.text) {
      content = '<div>' + escapeHtml(m.text) + '</div>' + content;
    }
    div.innerHTML = '<span class="who"></span>' + content + '<span class="when">' + when + '</span>';
    div.querySelector('.who').textContent = m.name + ':';
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
    if (box.children.length > 100) box.removeChild(box.firstChild);
  }
  function sendMsg(){
    const t = document.getElementById('chatText').value.trim();
    const n = document.getElementById('chatName').value.trim() || '匿名';
    if ((!t || !ws || ws.readyState !== 1)) { if (!t) return; }
    if (!ws || ws.readyState !== 1) return;
    ws.send(JSON.stringify({ type:'chat', name:n, text:t }));
    document.getElementById('chatText').value = '';
  }
  // ---- 粘贴图片发送（自动压缩到 ≤1024px）----
  document.getElementById('chatText').addEventListener('paste', (e) => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (let i = 0; i < items.length; i++) {
      if (items[i].type && items[i].type.indexOf('image') === 0) {
        const file = items[i].getAsFile();
        if (file) { e.preventDefault(); sendImage(file); break; }
      }
    }
  });
  function sendImage(file){
    const n = document.getElementById('chatName').value.trim() || '匿名';
    const img = new Image();
    const reader = new FileReader();
    reader.onload = () => {
      img.onload = () => {
        let w = img.width, h = img.height;
        const max = 1024;
        if (w > max || h > max) {
          const r = Math.min(max/w, max/h);
          w = Math.round(w*r); h = Math.round(h*r);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const base64 = canvas.toDataURL('image/jpeg', 0.8);
        if (!ws || ws.readyState !== 1) return;
        ws.send(JSON.stringify({ type:'chat', name:n, text:'', image:base64 }));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }
  function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  document.getElementById('chatText').addEventListener('keydown', e => { if (e.key === 'Enter') sendMsg(); });
  connect();

  // ---- 一起看 ----
  function toggleWatch(){ document.getElementById('watchPanel').classList.toggle('show'); }
  function biliToEmbed(url){
    let u = url.trim();
    // 纯 BV 号：BVxxxxxxxxxx
    if (/^BV[0-9A-Za-z]{10,}/.test(u)) return 'https://player.bilibili.com/player.html?bvid=' + u.match(/^BV[0-9A-Za-z]+/)[0] + '&autoplay=0';
    // 完整 URL
    const m = u.match(/bilibili\.com\/video\/(BV[0-9A-Za-z]+)/);
    if (m) return 'https://player.bilibili.com/player.html?bvid=' + m[1] + '&autoplay=0';
    return u;
  }
  function sendWatch(){
    const raw = document.getElementById('watchUrl').value.trim();
    if (!raw || !ws || ws.readyState !== 1) return;
    const url = biliToEmbed(raw);
    const name = document.getElementById('chatName').value.trim() || '匿名';
    ws.send(JSON.stringify({ type:'watch', url:url, name:name }));
    document.getElementById('watchFrame').src = url;
  }
  document.getElementById('watchUrl').addEventListener('keydown', e => { if (e.key === 'Enter') sendWatch(); });

  // ---- LiveKit 屏幕共享 ----
  const lkRoom = new LivekitClient.Room();
  let lkJoined = false;
  function toggleLive(){ document.getElementById('livePanel').classList.toggle('show'); }
  function setLiveStatus(s){ document.getElementById('liveStatus').textContent = s; }
  async function lkGetToken(identity){
    const res = await fetch('https://abing-chat.lct123456y.workers.dev/token?identity=' + encodeURIComponent(identity) + '&room=abing');
    return await res.json();
  }
  async function lkJoin(){
    if (lkJoined) return true;
    const id = 'u' + Math.random().toString(36).slice(2,8);
    const { token, url } = await lkGetToken(id);
    await lkRoom.connect(url, token);
    lkJoined = true;
    lkRoom.on('trackSubscribed', (track, pub, participant) => {
      if (track.kind === 'video' && pub.source === 'screen_share') {
        track.attach(document.getElementById('liveRemote'));
      }
    });
    lkRoom.on('trackUnsubscribed', (track) => { track.detach(); });
    return true;
  }
  async function startShare(){
    try {
      await lkJoin();
      const screen = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
      await lkRoom.localParticipant.publishTrack(screen.getVideoTracks()[0], { source: 'screen_share', name: 'screen' });
      document.getElementById('liveLocal').srcObject = screen;
      document.getElementById('livePreview').style.display = 'block';
      setLiveStatus('共享中 ✓（其他人已看到你的屏幕）');
    } catch(e){
      setLiveStatus('共享失败：' + e.message);
    }
  }
  // 观众自动加入（打开面板时）
  setInterval(async () => {
    if (document.getElementById('livePanel').classList.contains('show') && !lkJoined) {
      try { await lkJoin(); setLiveStatus('已连接（等待共享）'); } catch(e){}
    }
  }, 5000);
</script>
</body>
</html>

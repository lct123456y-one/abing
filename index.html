<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(ellipse at 20% 10%, rgba(124,58,237,.35), transparent 50%),
                radial-gradient(ellipse at 80% 30%, rgba(236,72,153,.25), transparent 50%),
                radial-gradient(ellipse at 50% 90%, rgba(59,130,246,.3), transparent 55%),
                linear-gradient(160deg, #0f0c29 0%, #1a1a4b 40%, #2d1b69 100%);
    color: #fff; padding: 20px; background-attachment: fixed;
  }
  .card {
    background: linear-gradient(rgba(20,12,40,.85), rgba(20,12,40,.85)), url('./ranran-bg.jpg') center/cover no-repeat;
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 24px; padding: 48px 56px; max-width: 460px; width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(76,29,149,.4), 0 0 0 1px rgba(255,255,255,.04) inset;
    position: relative; overflow: hidden;
  }
  .ranran-avatar { width: 96px; height: 96px; border-radius: 50%; border: 3px solid rgba(244,114,182,.6); box-shadow: 0 0 20px rgba(168,85,247,.5); margin: -20px auto 14px; display: block; object-fit: cover; }
  .card::before { content: "✨"; position: absolute; top: 16px; left: 16px; font-size: 20px; opacity: .7; animation: twinkle 2.5s ease-in-out infinite; }
  .card::after { content: "⭐"; position: absolute; top: 16px; right: 16px; font-size: 20px; opacity: .7; animation: twinkle 2.5s ease-in-out infinite .6s; }
  @keyframes twinkle { 0%,100%{ opacity:.4; transform:scale(.9);} 50%{ opacity:1; transform:scale(1.1);} }
  .badge {
    display: inline-block; background: linear-gradient(90deg, rgba(168,85,247,.3), rgba(236,72,153,.3));
    color: #e9d5ff; border: 1px solid rgba(168,85,247,.5); padding: 6px 18px; border-radius: 100px;
    font-size: 13px; letter-spacing: 2px; margin-bottom: 20px;
  }
  h1 { font-size: 42px; font-weight: 800; letter-spacing: 4px;
    background: linear-gradient(90deg, #e9d5ff, #f0abfc 40%, #fbbf24 90%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
  .sub { color: rgba(255,255,255,0.6); font-size: 14px; margin-bottom: 32px; letter-spacing: 1px; }
  .qq { font-size: 36px; font-weight: 700; letter-spacing: 3px; margin-bottom: 8px; font-variant-numeric: tabular-nums; }
  .qq-label { color: rgba(255,255,255,0.5); font-size: 13px; margin-bottom: 28px; }
  .btn {
    display: inline-block; width: 100%; padding: 16px 0; border-radius: 14px; border: none;
    font-size: 18px; font-weight: 700; letter-spacing: 3px; cursor: pointer;
    background: linear-gradient(90deg, #a855f7, #ec4899); color: #fff;
    transition: all .25s; text-decoration: none;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(168,85,247,.5); }
  .copy { margin-top: 14px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: rgba(255,255,255,0.85); }
  .copy:hover { background: rgba(255,255,255,0.15); box-shadow: none; transform: none; }
  .tip { margin-top: 24px; color: rgba(255,255,255,0.35); font-size: 12px; }

  /* 聊天空窗 */
  #chatPanel { display:none; position:fixed; bottom:20px; right:20px; width:340px; height:480px;
    background:#231437; border-radius:16px; box-shadow:0 12px 40px rgba(0,0,0,.5);
    flex-direction:column; overflow:hidden; z-index:99; border:1px solid rgba(255,255,255,.1); }
  #chatPanel.show { display:flex; }
  #chatPanel.dragging { opacity:.85; user-select:none; }
  #chatHead { background:linear-gradient(90deg,#a855f7,#ec4899); color:#fff; padding:10px 16px; font-size:15px; font-weight:700; display:flex; justify-content:space-between; align-items:center; cursor:move; }
  #chatClose { background:none; border:none; color:#fff; font-size:18px; cursor:pointer; }
  #chatMsgs { flex:1; overflow-y:auto; padding:12px; background:#1a0f2e; }
  .msg { margin-bottom:8px; font-size:14px; color:#e6edf5; }
  .msg .who { font-weight:700; color:#c4b5fd; margin-right:6px; }
  .msg .when { color:#8b7aa8; font-size:11px; margin-left:6px; }
  #chatInput { display:flex; border-top:1px solid rgba(255,255,255,.1); padding:8px; background:#1e2a38; }
  #chatName { width:30%; border:1px solid rgba(255,255,255,.2); background:#1a0f2e; color:#e6edf5; border-radius:8px; padding:8px; margin-right:6px; font-size:13px; }
  #chatText { flex:1; border:1px solid rgba(255,255,255,.2); background:#1a0f2e; color:#e6edf5; border-radius:8px; padding:8px; font-size:13px; }
  #chatSend { background:#a855f7; color:#fff; border:none; border-radius:8px; padding:0 14px; margin-left:6px; cursor:pointer; font-size:13px; }
  #danmuInputBar { display:flex; padding:6px 8px; background:#1a0f2e; border-top:1px solid rgba(255,255,255,.1); }
  #danmuText { flex:1; border:1px solid rgba(255,255,255,.2); background:#16202d; color:#e6edf5; border-radius:8px; padding:7px; font-size:13px; }
  #danmuSend { background:#f472b6; color:#fff; border:none; border-radius:8px; padding:0 14px; margin-left:6px; cursor:pointer; font-size:13px; }
  /* 弹幕层 */
  #danmuLayer { position:fixed; top:0; left:0; right:0; bottom:0; pointer-events:none !important; z-index:9998; overflow:hidden; }
  .danmu-item { position:absolute; left:100%; white-space:nowrap; font-size:18px; font-weight:700; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.8), 0 0 8px rgba(168,85,247,.6); animation:danmuFly linear forwards; }
  @keyframes danmuFly { from { transform:translateX(0); } to { transform:translateX(-100vw); } }
  #chatResize { position:absolute; bottom:0; right:0; width:16px; height:16px; cursor:nwse-resize; background:linear-gradient(135deg,transparent 50%,rgba(255,255,255,.4) 50%); }
  /* 聊天入口：左中上，更显眼 */
  #chatFab { position:fixed; top:120px; left:20px; padding:12px 20px; border-radius:24px;
    background:linear-gradient(90deg,#a855f7,#ec4899); color:#fff; font-size:16px; font-weight:700;
    border:none; cursor:pointer; box-shadow:0 6px 20px rgba(168,85,247,.5); z-index:98; }
  #chatFab:hover { transform:scale(1.05); }

  /* 一起看面板 */
  #watchFab { position:fixed; top:190px; left:20px; padding:12px 20px; border-radius:24px;
    background:linear-gradient(90deg,#c084fc,#f472b6); color:#fff; font-size:16px; font-weight:700;
    border:none; cursor:pointer; box-shadow:0 6px 20px rgba(244,114,182,.5); z-index:98; }
  #watchFab:hover { transform:scale(1.05); }
  #watchPanel { display:none; position:fixed; bottom:20px; left:20px; width:520px; height:420px;
    background:#231437; border-radius:16px; box-shadow:0 12px 40px rgba(0,0,0,.5);

  #watchPanel.show { display:flex; }
  #watchHead { background:linear-gradient(90deg,#c084fc,#f472b6); color:#fff; padding:10px 16px; font-size:15px; font-weight:700; display:flex; justify-content:space-between; align-items:center; cursor:move; }
  #watchClose { background:none; border:none; color:#fff; font-size:18px; cursor:pointer; }
  #watchInput { display:flex; padding:8px; background:#1e2a38; border-bottom:1px solid rgba(255,255,255,.1); }
  #watchUrl { flex:1; border:1px solid rgba(255,255,255,.2); background:#1a0f2e; color:#e6edf5; border-radius:8px; padding:8px; font-size:13px; }

  #watchHint { color:#8b7aa8; font-size:12px; padding:6px 12px; }

  /* LiveKit 面板 */
  #liveFab { position:fixed; top:260px; left:20px; padding:12px 20px; border-radius:24px;
    background:linear-gradient(90deg,#a855f7,#a78bfa); color:#fff; font-size:16px; font-weight:700;
    border:none; cursor:pointer; box-shadow:0 6px 20px rgba(168,85,247,.5); z-index:98; }
  #liveFab:hover { transform:scale(1.05); }
  #livePanel { display:none; position:fixed; bottom:20px; left:20px; width:560px; height:440px;
    background:#231437; border-radius:16px; box-shadow:0 12px 40px rgba(0,0,0,.5);
    flex-direction:column; overflow:hidden; z-index:99; border:1px solid rgba(255,255,255,.1); }
  #livePanel.show { display:flex; }
  #liveHead { background:linear-gradient(90deg,#a855f7,#a78bfa); color:#fff; padding:10px 16px; font-size:15px; font-weight:700; display:flex; justify-content:space-between; align-items:center; cursor:move; }
  #liveClose { background:none; border:none; color:#fff; font-size:18px; cursor:pointer; }
  #liveBtns { display:flex; align-items:center; gap:10px; padding:10px 12px; }
  #liveVolWrap { padding:0 12px 6px; color:#d8c9f5; font-size:13px; display:flex; align-items:center; gap:8px; }

  #shareBtn { background:#a855f7; color:#fff; border:none; border-radius:8px; padding:10px 18px; cursor:pointer; font-size:14px; font-weight:700; }
  #liveStatus { color:#8b7aa8; font-size:13px; }
  #livePreview { display:none; padding:0 12px; }
  #liveLocal { width:100%; max-height:180px; border-radius:8px; background:#000; margin-bottom:8px; }
  #liveWatch { flex:1; padding:0 12px; }
  #liveRemote { width:100%; height:100%; border-radius:8px; }
  #liveHint { color:#8b7aa8; font-size:12px; padding:6px 12px; }

  /* A-SOUL 右侧栏（直播状态 + 本周安排）—— 抽屉式，可拉出/隐藏 */
  .asoul-side { position:fixed; right:-340px; top:0; width:300px; height:100vh; padding:20px 16px;
    background:rgba(20,12,40,.9); backdrop-filter:blur(10px); border-left:1px solid rgba(255,255,255,.1);
    overflow-y:auto; z-index:90; transition: right .3s ease; }
  .asoul-side.open { right: 0; }
  .asoul-toggle { position:fixed; right:0; top:110px; background:linear-gradient(90deg,#a855f7,#ec4899); color:#fff; border:none; border-radius:10px 0 0 10px; padding:14px 6px; cursor:pointer; font-size:14px; writing-mode:vertical-rl; z-index:95; }
  .fs-btn { background:none; border:1px solid rgba(255,255,255,.4); color:#fff; border-radius:6px; padding:3px 8px; margin-right:8px; font-size:12px; cursor:pointer; }
  .fs-btn:hover { background:rgba(255,255,255,.15); }
  /* 全屏控件条 */
  #liveControls { display:none; position:absolute; bottom:0; left:0; right:0; background:rgba(0,0,0,.7); padding:10px 12px; justify-content:center; align-items:center; gap:10px; z-index:200; }
  #liveControls button { background:rgba(255,255,255,.15); color:#fff; border:none; border-radius:8px; padding:8px 12px; cursor:pointer; font-size:14px; }
  #liveControls input[type=range] { width:120px; }
  #livePanel:fullscreen #liveControls { display:flex; }
  #livePanel:fullscreen #liveHint { display:none; }
  #livePanel:fullscreen #liveWatch { flex:1; padding:0; }
  #livePanel:fullscreen #liveRemote { width:100%; height:100%; }
  .asoul-side h3 { color:#e9d5ff; font-size:16px; margin-bottom:14px; letter-spacing:1px; border-bottom:1px solid rgba(168,85,247,.3); padding-bottom:8px; }
  .asoul-live-row { display:flex; gap:6px; margin-bottom:8px; }
  #asoulLive { display:block; }
  .asoul-live-card, .asoul-sleep-card { flex:1 1 50px; text-align:center; }
  .asoul-live-card img, .asoul-sleep-card img { width:48px; height:48px; border-radius:50%; border:2px solid rgba(255,255,255,.2); display:block; margin:0 auto 3px; }
  .asoul-live-card .nm, .asoul-sleep-card .nm { color:#d8c9f5; font-size:11px; display:block; }
  .asoul-live-card .dot { display:block; width:8px; height:8px; border-radius:50%; background:#555; margin:2px auto 0; }
  .asoul-live-card.online img { border-color:#22c55e; box-shadow:0 0 12px rgba(34,197,94,.6); }
  .asoul-live-card.online .dot { background:#22c55e; animation:blink 1s infinite; }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:.3;} }
  .asoul-live-card a { color:#e9d5ff; font-size:10px; text-decoration:none; display:block; }
  .asoul-live-card.online a { color:#4ade80; }
  .asoul-sched { font-size:13px; }
  .asoul-sched .day { color:#f0abfc; font-weight:700; margin-top:10px; margin-bottom:4px; }
  .asoul-sched .item { color:#d8c9f5; padding:4px 0; display:flex; justify-content:space-between; border-bottom:1px solid rgba(255,255,255,.06); }
  .asoul-sched .item .m { font-weight:600; }
  .asoul-sched .item .t { color:#a78bfa; }
  .asoul-sleep-divider { display:flex; align-items:center; gap:8px; margin:14px 0 10px; color:#8b7aa8; font-size:12px; }
  .asoul-sleep-divider::before, .asoul-sleep-divider::after { content:""; flex:1; height:1px; background:rgba(168,85,247,.3); }
  .asoul-sleep-card { opacity:.8; }
  .asoul-sleep-card img { border-color:rgba(255,255,255,.15); filter:grayscale(.35); }
  .asoul-sleep-card .nm { color:#a896c9; }

  /* 手机端适配 */
  @media (max-width: 768px) {
    body { padding: 0; align-items: center; }
    /* 主卡片：屏幕中央当背景 */
    .card { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); max-width: 88%; padding: 28px 20px; }
    h1 { font-size: 32px; }
    .qq { font-size: 28px; }
    /* 三个功能按钮：屏幕最左侧竖排 */
    #chatFab, #watchFab, #liveFab { position: fixed; left: 4px; padding: 10px 8px; font-size: 12px; margin: 0; border-radius: 12px; writing-mode: vertical-rl; }
    #chatFab { top: 90px; }
    #watchFab { top: 160px; }
    #liveFab { top: 230px; }
    /* A-SOUL 直播栏抽屉：手机默认收起（点 🌙 拉出）*/
    .asoul-side { width: 270px; right: -290px; }
    .asoul-side.open { right: 0; }
    /* 面板手机端：默认缩小（可拖动）*/
    #chatPanel, #watchPanel, #livePanel { width: 92vw; height: 55vh; left: 4vw; right: auto; bottom: auto; top: 20vh; border-radius: 14px; }
    #watchPanel { height: 48vh; }
  }
</style>

<script>
  // A-SOUL 成员（头像 + 房间）
  const ASOUL = [
    { name: "嘉然", img: "./asoul-jiaran.jpg", room: 22637261 },
    { name: "乃琳", img: "./asoul-nailin.jpg", room: 22625027 },
    { name: "贝拉", img: "./asoul-beila.jpg", room: 22632424 },
    { name: "心宜", img: "./asoul-xinyi.jpg", room: 30849777 },
    { name: "思诺", img: "./asoul-sinuo.jpg", room: 30858592 }
  ];
  // ---- A-SOUL 直播状态 + 安排 ----
  async function loadAsoul(){
    try {
      const res = await fetch('https://abing-chat.lct123456y.workers.dev/asoul-live');
      const data = await res.json();
      const wrap = document.getElementById('asoulLive');
      wrap.innerHTML = '';
      // 3+2 分组：前3一排，后2一排（心宜陪思诺）
      const mkRow = (arr) => {
        const row = document.createElement('div'); row.className = 'asoul-live-row';
        arr.forEach(m => {
          const card = document.createElement('a');
          card.className = 'asoul-live-card' + (m.live ? ' online' : '');
          card.href = m.url; card.target = '_blank';
          card.innerHTML = '<img src="' + (ASOUL.find(x => x.name === m.name)?.img || '') + '"><span class="nm">' + m.name + '</span><span class="dot"></span>' + (m.live ? '<span>开播中</span>' : '');
          row.appendChild(card);
        });
        return row;
      };
      if (data.members.length >= 5) {
        wrap.appendChild(mkRow(data.members.slice(0, 3)));
        wrap.appendChild(mkRow(data.members.slice(3)));
      } else {
        wrap.appendChild(mkRow(data.members));
      }
    } catch(e) {}
  }
  // 本周安排（示例，主人每周更新）
  const SCHED = [
    { day: "周一", items: [{ m: "嘉然", t: "20:00" }, { m: "乃琳", t: "21:00" }] },
    { day: "周三", items: [{ m: "贝拉", t: "19:30" }] },
    { day: "周五", items: [{ m: "思诺", t: "20:30" }, { m: "心宜", t: "22:00" }] },
    { day: "周六", items: [{ m: "嘉然", t: "19:00" }] }
  ];
  function renderSched(){
    const box = document.getElementById('asoulSched');
    box.innerHTML = '';
    SCHED.forEach(d => {
      const dayDiv = document.createElement('div');
      dayDiv.className = 'day'; dayDiv.textContent = '· ' + d.day;
      box.appendChild(dayDiv);
      d.items.forEach(it => {
        const row = document.createElement('div');
        row.className = 'item';
        row.innerHTML = '<span class="m">' + it.m + '</span><span class="t">' + it.t + '</span>';
        box.appendChild(row);
      });
    });
  }
  loadAsoul(); renderSched();
  // "睡着了"成员（向晚/珈乐）
  const SLEEP = [
    { name: "向晚", img: "./asoul-xiangwan.jpg", uid: "672346917" },
    { name: "珈乐", img: "./asoul-jiale.jpg", uid: "351609538" }
  ];
  (function(){
    const box = document.getElementById('asoulSleep');
    SLEEP.forEach(s => {
      const a = document.createElement('a');
      a.className = 'asoul-sleep-card';
      a.href = 'https://space.bilibili.com/' + s.uid; a.target = '_blank';
      a.innerHTML = '<img src="' + s.img + '"><span class="nm">' + s.name + ' 💤</span>';
      box.appendChild(a);
    });
  })();
  setInterval(loadAsoul, 60000);

  function copyQQ(){
    navigator.clipboard.writeText("1098549767").then(()=>{      const b = document.querySelector(".copy");
      b.textContent = "已复制 ✓";
      setTimeout(()=>{ b.textContent = "复制群号"; }, 1500);
    });
  }
  let ws = null;
  function toggleChat(){ document.getElementById('chatPanel').classList.toggle('show'); }

  // ---- 通用拖动（标题栏，鼠标+触屏）----
  function makeDraggable(panel, head){
    let dragging = false, offX = 0, offY = 0;
    const start = function(x, y){ dragging = true; panel.classList.add('dragging'); offX = x - panel.offsetLeft; offY = y - panel.offsetTop; };
    const move = function(x, y){ if (!dragging) return; panel.style.left = (x - offX) + 'px'; panel.style.top = (y - offY) + 'px'; panel.style.right = 'auto'; panel.style.bottom = 'auto'; };
    const stop = function(){ dragging = false; panel.classList.remove('dragging'); };
    head.addEventListener('mousedown', function(e){ start(e.clientX, e.clientY); e.preventDefault(); });
    document.addEventListener('mousemove', function(e){ move(e.clientX, e.clientY); });
    document.addEventListener('mouseup', stop);
    head.addEventListener('touchstart', function(e){ const t = e.touches[0]; start(t.clientX, t.clientY); }, {passive:true});
    document.addEventListener('touchmove', function(e){ const t = e.touches[0]; move(t.clientX, t.clientY); }, {passive:true});
    document.addEventListener('touchend', stop);
  }
  // ---- 通用缩放（右下角把手，鼠标+触屏）----
  function makeResizable(panel, handle){
    let resizing = false, sx = 0, sy = 0, sw = 0, sh = 0;
    const start = function(x, y){ resizing = true; sx = x; sy = y; sw = panel.offsetWidth; sh = panel.offsetHeight; };
    const move = function(x, y){ if (!resizing) return; panel.style.width = Math.max(240, sw + (x - sx)) + 'px'; panel.style.height = Math.max(300, sh + (y - sy)) + 'px'; };
    const stop = function(){ resizing = false; };
    handle.addEventListener('mousedown', function(e){ start(e.clientX, e.clientY); e.preventDefault(); e.stopPropagation(); });
    document.addEventListener('mousemove', function(e){ move(e.clientX, e.clientY); });
    document.addEventListener('mouseup', stop);
    handle.addEventListener('touchstart', function(e){ const t = e.touches[0]; start(t.clientX, t.clientY); e.stopPropagation(); }, {passive:true});
    document.addEventListener('touchmove', function(e){ const t = e.touches[0]; move(t.clientX, t.clientY); }, {passive:true});
    document.addEventListener('touchend', stop);
  }
  makeDraggable(document.getElementById('chatPanel'), document.getElementById('chatHead'));
  makeResizable(document.getElementById('chatPanel'), document.getElementById('chatResize'));
  makeDraggable(document.getElementById('watchPanel'), document.getElementById('watchHead'));
  makeResizable(document.getElementById('watchPanel'), document.getElementById('watchResize'));

  function connect(){
    try { ws = new WebSocket('wss://abing-chat.lct123456y.workers.dev'); } catch(e){ setTimeout(connect, 3000); return; }
    ws.onmessage = (ev) => {
      const d = JSON.parse(ev.data);
      if (d.type === 'history') { d.messages.forEach(addMsg); }
      else if (d.type === 'chat') { addMsg(d.message); }
      else if (d.type === 'danmu' && d.message && d.message.text) { showDanmu(d.message); }
      else if (d.type === 'watch' && d.watch && d.watch.url) {
        document.getElementById('watchFrame').src = d.watch.url;
        document.getElementById('watchUrl').value = d.watch.url;
        // 默认收起：收到同步只更新内容，不自动弹出面板
      }
    };
    ws.onopen = () => { try { document.getElementById('wsDot').style.background = '#22c55e'; document.getElementById('wsTxt').textContent = '已连接'; } catch(e){} };
    ws.onerror = () => { setTimeout(connect, 3000); };
    ws.onclose = () => { try { document.getElementById('wsDot').style.background = '#f87171'; document.getElementById('wsTxt').textContent = '未连接'; } catch(e){} setTimeout(connect, 3000); };
  }
  function addMsg(m){
    if (!m || (!m.text && !m.image)) return;
    const box = document.getElementById('chatMsgs');
    const div = document.createElement('div');
    div.className = 'msg';
    const when = new Date(m.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    let content = '';
    if (m.image) {
      content = '<img src="' + m.image + '" style="max-width:100%;max-height:200px;border-radius:8px;display:block;margin-top:4px;" onclick="window.open(this.src)">';
    }
    if (m.text) {
      content = '<div>' + escapeHtml(m.text) + '</div>' + content;
    }
    div.innerHTML = '<span class="who"></span>' + content + '<span class="when">' + when + '</span>';
    div.querySelector('.who').textContent = m.name + ':';
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
    if (box.children.length > 100) box.removeChild(box.firstChild);
  }
  function sendMsg(){
    const t = document.getElementById('chatText').value.trim();
    const n = document.getElementById('chatName').value.trim() || '匿名';
    if (!t) return;
    if (!ws || ws.readyState !== 1) {
      document.getElementById('chatText').value = t;
      document.getElementById('chatText').placeholder = '连接中/失败，点一下重试…';
      connect();
      return;
    }
    ws.send(JSON.stringify({ type:'chat', name:n, text:t }));
    document.getElementById('chatText').value = '';
  }
  // 弹幕
  function sendDanmu(){
    const t = document.getElementById('danmuText').value.trim();
    const n = document.getElementById('chatName').value.trim() || '匿名';
    if (!t || !ws || ws.readyState !== 1) return;
    ws.send(JSON.stringify({ type:'danmu', name:n, text:t }));
    document.getElementById('danmuText').value = '';
  }
  function showDanmu(m){
    const layer = document.getElementById('danmuLayer');
    const el = document.createElement('div');
    el.className = 'danmu-item';
    el.textContent = m.name + ': ' + m.text;
    const top = 10 + Math.random() * 70;
    el.style.top = top + 'vh';
    const dur = 5 + Math.random() * 4;
    el.style.animationDuration = dur + 's';
    layer.appendChild(el);
    setTimeout(() => { el.remove(); }, dur * 1000 + 500);
  }
  document.getElementById('danmuText').addEventListener('keydown', e => { if (e.key === 'Enter') sendDanmu(); });
  // ---- 粘贴图片发送（自动压缩到 ≤1024px）----
  document.getElementById('chatText').addEventListener('paste', (e) => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (let i = 0; i < items.length; i++) {
      if (items[i].type && items[i].type.indexOf('image') === 0) {
        const file = items[i].getAsFile();
        if (file) { e.preventDefault(); sendImage(file); break; }
      }
    }
  });
  function sendImage(file){
    const n = document.getElementById('chatName').value.trim() || '匿名';
    const img = new Image();
    const reader = new FileReader();
    reader.onload = () => {
      img.onload = () => {
        let w = img.width, h = img.height;
        const max = 1024;
        if (w > max || h > max) {
          const r = Math.min(max/w, max/h);
          w = Math.round(w*r); h = Math.round(h*r);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const base64 = canvas.toDataURL('image/jpeg', 0.8);
        if (!ws || ws.readyState !== 1) return;
        ws.send(JSON.stringify({ type:'chat', name:n, text:'', image:base64 }));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }
  function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  document.getElementById('chatText').addEventListener('keydown', e => { if (e.key === 'Enter') sendMsg(); });
  connect();

  // ---- 一起看 ----
  function toggleWatch(){ document.getElementById('watchPanel').classList.toggle('show'); }
  function biliToEmbed(url){
    let u = url.trim();
    // 纯 BV 号：BVxxxxxxxxxx
    if (/^BV[0-9A-Za-z]{10,}/.test(u)) return 'https://player.bilibili.com/player.html?bvid=' + u.match(/^BV[0-9A-Za-z]+/)[0] + '&autoplay=0';
    // 完整 URL
    const m = u.match(/bilibili\.com\/video\/(BV[0-9A-Za-z]+)/);
    if (m) return 'https://player.bilibili.com/player.html?bvid=' + m[1] + '&autoplay=0';
    return u;
  }
  function sendWatch(){
    const raw = document.getElementById('watchUrl').value.trim();
    if (!raw || !ws || ws.readyState !== 1) return;
    const url = biliToEmbed(raw);
    const name = document.getElementById('chatName').value.trim() || '匿名';
    ws.send(JSON.stringify({ type:'watch', url:url, name:name }));
    document.getElementById('watchFrame').src = url;
  }
  document.getElementById('watchUrl').addEventListener('keydown', e => { if (e.key === 'Enter') sendWatch(); });

  // ---- LiveKit 屏幕共享 ----
  const lkRoom = new LivekitClient.Room();
  let lkJoined = false;
  function toggleLive(){ document.getElementById('livePanel').classList.toggle('show'); }
  function toggleAsoul(){ document.querySelector('.asoul-side').classList.toggle('open'); }
  function fs(id){
    const el = document.getElementById(id);
    if (el.requestFullscreen) { el.requestFullscreen().then(()=>{ try { screen.orientation.lock('landscape'); } catch(e){} }); }
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }
  function exitFs(){ if (document.exitFullscreen) document.exitFullscreen(); }
  function setVol(v){ document.getElementById('liveRemote').volume = parseFloat(v); }
  function back10(){ const v = document.getElementById('liveRemote'); v.currentTime = Math.max(0, v.currentTime - 10); }
  function fwd10(){ const v = document.getElementById('liveRemote'); v.currentTime = v.currentTime + 10; }
  function setLiveStatus(s){ document.getElementById('liveStatus').textContent = s; }
  async function lkGetToken(identity){
    const res = await fetch('https://abing-chat.lct123456y.workers.dev/token?identity=' + encodeURIComponent(identity) + '&room=abing');
    return await res.json();
  }
  async function lkJoin(){
    if (lkJoined) return true;
    // 查密码+版本号：有密码则先验证（比对版本号，换密码后要重验）
    try {
      const pr = await fetch('https://abing-chat.lct123456y.workers.dev/get-live-pass');
      const pd = await pr.json();
      if (pd.pass && (!window._authed || window._authedRev !== pd.rev)) {
        const input = prompt('本次屏幕共享需要密码，请输入：');
        if (input !== pd.pass) { setLiveStatus('密码错误，无法观看'); return false; }
        window._authed = true; window._authedRev = pd.rev;
      }
    } catch(e) {}
    const id = 'u' + Math.random().toString(36).slice(2,8);
    const { token, url } = await lkGetToken(id);
    // 事件监听放在 connect 前，确保不漏早期订阅
    lkRoom.on('trackSubscribed', (track, pub, participant) => {
      if (participant.identity === lkRoom.localParticipant.identity) return;
      // 视频 + 音频都 attach 到 liveRemote（video 元素同时输出画面和声音）
      if (track.kind === 'video' || track.kind === 'audio') {
        track.attach(document.getElementById('liveRemote'));
        document.getElementById('liveRemote').muted = false;
        document.getElementById('liveRemote').volume = 0.1; // 默认音量 10%（不吵）
        document.getElementById('livePanel').classList.add('show');
        setLiveStatus('正在观看共享屏幕');
        const v = document.getElementById('liveRemote'); v.play().catch(function(){});
      }
    });
    lkRoom.on('trackUnsubscribed', (track) => { track.detach(); });
    await lkRoom.connect(url, token);
    lkJoined = true;
    return true;
  }
  async function startShare(){
    try {
      // 设置密码（可选）：填了则设，没填则清空
      const pass = document.getElementById('livePass').value.trim();
      await fetch('https://abing-chat.lct123456y.workers.dev/set-live-pass?pass=' + encodeURIComponent(pass));
      await lkJoin();
      const screen = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
      await lkRoom.localParticipant.publishTrack(screen.getVideoTracks()[0], { source: 'screen_share', name: 'screen' });
      // 发布音频（屏幕共享的声音/系统声/麦克风）
      if (screen.getAudioTracks().length > 0) {
        await lkRoom.localParticipant.publishTrack(screen.getAudioTracks()[0], { source: 'microphone', name: 'screen-audio' });
      }
      document.getElementById('liveLocal').srcObject = screen;
      document.getElementById('livePreview').style.display = 'block';
      setLiveStatus(pass ? ('共享中 ✓ 已设密码：' + pass) : '共享中 ✓（无密码，谁都能看）');
    } catch(e){
      setLiveStatus('共享失败：' + e.message);
    }
  }
  // 观众自动加入（进网站就 join，A 共享时自动看到；后进来的人也能接上）
  setInterval(async () => {
    if (!lkJoined) {
      try { await lkJoin(); } catch(e){}
    }
  }, 5000);
  // 心跳密码检测：已加入的人也要验证（A 改密码后，所有人重新验证）
  window._authed = false; window._authedRev = 0;
  setInterval(async () => {
    try {
      if (lkJoined) {
        const pd = await (await fetch('https://abing-chat.lct123456y.workers.dev/get-live-pass')).json();
        if (pd.pass && (!window._authed || window._authedRev !== pd.rev)) {
          const input = prompt('屏幕共享密码已更新，请输入：');
          if (input === pd.pass) { window._authed = true; window._authedRev = pd.rev; }
          else { lkRoom.disconnect(); lkJoined = false; window._authed = false; window._authedRev = 0; }
        }
      }
    } catch(e){}
  }, 8000);
  // 用户点击画面 → 解锁声音（浏览器 autoplay 限制）
  document.addEventListener('click', function tryUnlock(){
    const v = document.getElementById('liveRemote');
    if (v && v.readyState > 0) {
      v.muted = false;
      v.play().then(() => { document.removeEventListener('click', tryUnlock); }).catch(function(){});
    }
  });
</script>
